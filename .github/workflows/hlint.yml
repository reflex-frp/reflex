name: HLint
on:
  - push
  - pull_request
jobs:
  hlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: src/
          fail-on: suggestion
